<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Parler · 法语学习</title>
  <link rel="stylesheet" href="app.css">
  <script src="vendor/lucide.min.js" defer></script>
  <script src="vocab-ext.js" defer></script>
  <script src="highfreq.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
  <div id="app" class="app-shell">
    <aside class="sidebar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true"><span></span><span></span><span></span></span>
        <div><strong>Parler</strong><small>法语入门</small></div>
      </div>
      <nav class="side-nav" aria-label="主导航">
        <button class="nav-btn active" data-view="learn" type="button"><i data-lucide="book-open"></i><span>学习</span></button>
      <button class="nav-btn" data-view="courses" type="button"><i data-lucide="book-marked"></i><span>课程</span></button>
        <button class="nav-btn" data-view="courses" type="button"><i data-lucide="book-marked"></i><span>课程</span></button>
        <button class="nav-btn" data-view="practice" type="button"><i data-lucide="zap"></i><span>练习</span></button>
        <button class="nav-btn" data-view="words" type="button"><i data-lucide="layers"></i><span>单词本</span></button>
        <button class="nav-btn" data-view="lookup" type="button"><i data-lucide="search"></i><span>查单词</span></button>
        <button class="nav-btn" data-view="stats" type="button"><i data-lucide="chart-column"></i><span>统计</span></button>
      </nav>
      <div class="sidebar-foot">
        <div id="sideStreak" class="side-stat"><i data-lucide="flame"></i><span>0 天</span></div>
        <div id="sideXp" class="side-stat"><i data-lucide="star"></i><span>0 XP</span></div>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <div class="topbar-title">
          <h1 id="pageTitle">学习</h1>
          <span id="levelBadge" class="level-badge">新手</span>
        </div>
        <div class="topbar-meta">
          <span id="todayXp" class="pill"><i data-lucide="star"></i>今日 +0</span>
          <span id="streakPill" class="pill"><i data-lucide="flame"></i>0 天</span>
          <button id="settingsBtn" class="icon-btn" type="button" title="设置" aria-label="设置"><i data-lucide="settings"></i></button>
        </div>
      </header>
      <section id="view-learn" class="view active"></section>
      <section id="view-courses" class="view"></section>
      <section id="view-practice" class="view"></section>
      <section id="view-words" class="view"></section>
      <section id="view-lookup" class="view"></section>
      <section id="view-stats" class="view"></section>
    </main>

    <nav class="mobile-nav" aria-label="移动端导航">
      <button class="nav-btn active" data-view="learn" type="button"><i data-lucide="book-open"></i><span>学习</span></button>
      <button class="nav-btn" data-view="practice" type="button"><i data-lucide="zap"></i><span>练习</span></button>
      <button class="nav-btn" data-view="words" type="button"><i data-lucide="layers"></i><span>单词</span></button>
      <button class="nav-btn" data-view="lookup" type="button"><i data-lucide="search"></i><span>查询</span></button>
      <button class="nav-btn" data-view="stats" type="button"><i data-lucide="chart-column"></i><span>统计</span></button>
    </nav>
  </div>

  <div id="lessonOverlay" class="lesson-overlay hidden" aria-hidden="true">
    <div class="lesson-top">
      <button id="lessonClose" class="icon-btn" type="button" title="退出" aria-label="退出"><i data-lucide="x"></i></button>
      <div class="lesson-track"><div id="lessonProgress" class="lesson-progress"></div></div>
      <span id="lessonStepLabel" class="lesson-step-label">1 / 1</span>
    </div>
    <div id="lessonBody" class="lesson-body"></div>
    <div class="lesson-footer">
      <button id="lessonContinue" class="btn primary" type="button">继续</button>
    </div>
  </div>

  <div id="settingsOverlay" class="modal-overlay hidden" aria-hidden="true">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="settingsTitle">
      <div class="modal-head">
        <h2 id="settingsTitle">设置</h2>
        <button id="settingsClose" class="icon-btn" type="button" title="关闭" aria-label="关闭"><i data-lucide="x"></i></button>
      </div>
      <div class="settings-list">
        <label class="setting-row">
          <span>自动朗读<small>新词和听力题自动播放</small></span>
          <input id="settingAuto" type="checkbox">
        </label>
        <label class="setting-row">
          <span>答题提示音</span>
          <input id="settingSound" type="checkbox">
        </label>
        <div class="setting-row">
          <span>朗读语速 <span id="rateValue" class="muted"></span></span>
          <input id="settingRate" type="range" min="0.6" max="1.2" step="0.1">
        </div>
        <button id="resetBtn" class="btn danger-ghost" type="button">清空学习记录</button>
      </div>
    </div>
  </div>

  <noscript>请启用 JavaScript 后使用 Parler。</noscript>
</body>
</html>
